# Render Blueprint: https://render.com/docs/blueprint-spec
# Creates the web service (app + API) and a Postgres database for accounts/history.
services:
  - type: web
    name: scamshield
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: scamshield-db
          property: connectionString

databases:
  - name: scamshield-db
    plan: free
    databaseName: scamshield
    user: scamshield
